<!DOCTYPE html>
<html>
<head>
    <title>Repayment Reminder</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">
    <table width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td align="center">
                <table width="500" style="background-color: #ffffff; padding: 20px; border-radius: 8px;">

                    <tr>
                        <td align="center">
                            <h2>Payment Reminder</h2>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <p>Hello {{Name}},</p>

                            <p>This is a reminder for your upcoming repayment.</p>

                            <p><b>Amount Due:</b> {{AmountDue}}</p>
                            <p><b>Due Date:</b> {{DueDate}}</p>

                            <p style="color: red; margin-top: 20px;">
                                Please ensure payment is made before the due date.
                            </p>
                        </td>
                    </tr>

                    <tr>
                        <td style="font-size: 12px; color: #888; text-align: center;">
                            © 2026 Ploutos Finance. All rights reserved.
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
